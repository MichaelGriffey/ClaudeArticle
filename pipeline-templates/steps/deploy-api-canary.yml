# Example contents of the contoso/pipeline-templates repository (pinned by tag in azure-pipelines.yml).
# Progressive release: deploy to the canary slot, route a share of traffic, watch the alerts,
# then promote. Any failure before the swap rolls back automatically: production never changed.
parameters:
- name: package
  type: string
- name: azureSubscription
  type: string
  default: $(azureSubscription)
- name: appName
  type: string
  default: $(appName)
- name: canaryPercent
  type: number
  default: 10
- name: observeMinutes
  type: number
  default: 15
- name: checkIntervalSeconds
  type: number
  default: 60

steps:
- template: deploy-api.yml
  parameters:
    package: ${{ parameters.package }}
    azureSubscription: ${{ parameters.azureSubscription }}
    appName: ${{ parameters.appName }}
    slot: canary

- task: AzureCLI@2
  displayName: Route ${{ parameters.canaryPercent }}% of traffic to canary
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: >
      az webapp traffic-routing set
      --name ${{ parameters.appName }}
      --resource-group $(resourceGroup)
      --distribution canary=${{ parameters.canaryPercent }}

# The signal is the Azure Monitor alert rules on the canary slot (error rate, p99 latency, failed
# health checks). The step polls them instead of sleeping, and a fired alert fails the run, which
# triggers the rollback below.
- task: AzureCLI@2
  displayName: Watch canary alerts for ${{ parameters.observeMinutes }} minutes
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      slot_id=$(az webapp show --name "${{ parameters.appName }}" --resource-group "$(resourceGroup)" \
        --slot canary --query id -o tsv)
      subscription=$(az account show --query id -o tsv)
      alerts="https://management.azure.com/subscriptions/${subscription}/providers/Microsoft.AlertsManagement/alerts"
      deadline=$(( $(date +%s) + ${{ parameters.observeMinutes }} * 60 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        fired=$(az rest --method get \
          --url "${alerts}?api-version=2019-05-05-preview&targetResource=${slot_id}&monitorCondition=Fired&timeRange=1h" \
          --query "length(value)" -o tsv)
        if [ "$fired" -gt 0 ]; then
          echo "##vso[task.logissue type=error]${fired} alert(s) fired on the canary slot."
          exit 1
        fi
        sleep ${{ parameters.checkIntervalSeconds }}
      done

# Stop routing before the swap: after it, the canary slot holds the previous build.
- task: AzureCLI@2
  displayName: Clear traffic routing
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: >
      az webapp traffic-routing clear
      --name ${{ parameters.appName }}
      --resource-group $(resourceGroup)

- task: AzureAppServiceManage@0
  displayName: Promote canary to production
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    Action: Swap Slots
    WebAppName: ${{ parameters.appName }}
    ResourceGroupName: $(resourceGroup)
    SourceSlot: canary

# Automatic rollback: a failure before the swap left production untouched, so sending all traffic
# back to it undoes the canary without a meeting.
- task: AzureCLI@2
  displayName: Roll back canary traffic
  condition: failed()
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: >
      az webapp traffic-routing clear
      --name ${{ parameters.appName }}
      --resource-group $(resourceGroup)
